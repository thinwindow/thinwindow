<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="t d">
<title id="t">ThinWindow benchmark: change in total tokens per task, claude-sonnet-5-5</title>
<desc id="d">One bar per task: the change in median total tokens with ThinWindow against plain Claude Code; left of zero is fewer tokens, right of zero more. Each whisker spans every pairing of a ThinWindow run with a baseline run of that task. Total 887k versus 896k (+1.0%). 95% interval over the 8 tasks: −31.5% to +19.5%. It includes zero: on these tasks the change can’t be told apart from none. Success 24/24 versus 24/24.</desc>
<style>
  /* Edit these six lines to restyle every chart. Light values first, dark
     below; both are validated categorical slots 1 and 2. */
  svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--grid:#d1d9e0;--base:#2a78d6;--tw:#eb6834}
  @media (prefers-color-scheme: dark){
    svg{--surface:#1a1a19;--ink:#ffffff;--ink-2:#c3c2b7;--grid:#3d444d;--base:#3987e5;--tw:#d95926}
  }
  text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink-2)}
  .grid{stroke:var(--grid);stroke-width:1}
  .zero{stroke:var(--ink-2);stroke-width:1.5}
  .win{fill:var(--tw)}.lose{fill:var(--base)}
  .whisk{stroke:var(--ink);stroke-width:1.25;fill:none}.arrow{fill:var(--ink)}
  .h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:12px}.lbl{font-size:12px}.val{font-size:11px}
  .delta{font-size:12px;font-weight:650}
</style>
<rect width="780" height="470" fill="var(--surface)"/>
<text class="ink h1" x="0" y="24">Change in total tokens per task</text>
<text class="ink2 h2" x="0" y="44">claude-sonnet-5-5 · Claude Code 2.1.290 · medians of up to 3 runs per task and condition</text>
<text class="ink" x="0" y="76" font-size="24" font-weight="680">+1.0%</text>
<text class="ink2 h2" x="104" y="76">total tokens · 887k → 896k · success 24/24 → 24/24</text>
<text class="ink h2" x="0" y="98">95% interval over the 8 tasks: −31.5% to +19.5%. It includes zero: on these tasks the change can’t be told apart from none.</text>
<rect class="win" x="0" y="114" width="11" height="11" rx="2"/><text class="ink lbl" x="17" y="124">fewer tokens with ThinWindow</text>
<rect class="lose" x="206" y="114" width="11" height="11" rx="2"/><text class="ink lbl" x="223" y="124">more tokens with ThinWindow</text>
