<path class="win" d="M504.2,282.5H514.4V297.5H504.2A4,4 0 0 1 500.2,293.5V286.5A4,4 0 0 1 504.2,282.5Z"><title>commander-command-clash: 284k → 275k tokens (−3.0%); over every pair of runs −4.6% to −1.4%, success 2/2 → 2/2</title></path>
<path class="whisk" d="M492.5,286V294M492.5,290H508.0M508.0,286V294"/>
