<path class="lose" d="M514.4,316.5H518.8A4,4 0 0 1 522.8,320.5V327.5A4,4 0 0 1 518.8,331.5H514.4Z"><title>commander-negate-default-order: 334k → 340k tokens (+1.8%); over every pair of runs −15.1% to +20.9%, success 2/2 → 2/2</title></path>
<path class="whisk" d="M442.7,320V328M442.7,324H613.3M613.3,320V328"/>
<text class="ink delta" x="722" y="328">+1.8%</text>
<text class="ink lbl" x="202" y="357" text-anchor="end">click-footer-year</text>
