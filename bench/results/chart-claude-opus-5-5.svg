<text class="ink delta" x="682.3" y="340" text-anchor="start">+14.1%</text>
<text class="ink lbl" x="202" y="369" text-anchor="end">commander-ci-config</text>
<text class="ink2 val" x="202" y="382" text-anchor="end">92k → 107k</text>
