<path class="win" d="M462.1,248.5H514.4V263.5H462.1A4,4 0 0 1 458.1,259.5V252.5A4,4 0 0 1 462.1,248.5Z"><title>commander-rename-display-width: 122k → 107k tokens (−11.9%); over every pair of runs −24.9% to +1.2%, success 2/2 → 2/2</title></path>
