<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="t d">
<title id="t">ThinWindow benchmark: change in total tokens per task, claude-opus-5-5</title>
<desc id="d">One bar per task: the change in median total tokens with ThinWindow against plain Claude Code; left of zero is fewer tokens, right of zero more. Each whisker spans every pairing of a ThinWindow run with a baseline run of that task. Total 2.10M versus 1.77M (−15.8%). 95% interval over the 8 tasks: −28.3% to +0.4%. It includes zero: on these tasks the change can’t be told apart from none. Success 16/16 versus 16/16.</desc>
<style>
  /* Edit these six lines to restyle every chart. Light values first, dark
     below; both are validated categorical slots 1 and 2. */
  svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--grid:#d1d9e0;--base:#2a78d6;--tw:#eb6834}
  @media (prefers-color-scheme: dark){
    svg{--surface:#1a1a19;--ink:#ffffff;--ink-2:#c3c2b7;--grid:#3d444d;--base:#3987e5;--tw:#d95926}
  }
  text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink-2)}
  .grid{stroke:var(--grid);stroke-width:1}
  .zero{stroke:var(--ink-2);stroke-width:1.5}
  .win{fill:var(--tw)}.lose{fill:var(--base)}
  .whisk{stroke:var(--ink);stroke-width:1.25;fill:none}.arrow{fill:var(--ink)}
  .h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:12px}.lbl{font-size:12px}.val{font-size:11px}
  .delta{font-size:12px;font-weight:650}
</style>
<rect width="780" height="470" fill="var(--surface)"/>
<text class="ink h1" x="0" y="24">Change in total tokens per task</text>
<text class="ink2 h2" x="0" y="44">claude-opus-5-5 · Claude Code 2.1.282 · medians of up to 2 runs per task and condition</text>
<text class="ink" x="0" y="76" font-size="24" font-weight="680">−15.8%</text>
<text class="ink2 h2" x="104" y="76">total tokens · 2.10M → 1.77M · success 16/16 → 16/16</text>
<text class="ink h2" x="0" y="98">95% interval over the 8 tasks: −28.3% to +0.4%. It includes zero: on these tasks the change can’t be told apart from none.</text>
<rect class="win" x="0" y="114" width="11" height="11" rx="2"/><text class="ink lbl" x="17" y="124">fewer tokens with ThinWindow</text>
<rect class="lose" x="206" y="114" width="11" height="11" rx="2"/><text class="ink lbl" x="223" y="124">more tokens with ThinWindow</text>
<path class="whisk" d="M412,115.5V123.5M412,119.5H440M440,115.5V123.5"/>
<text class="ink lbl" x="448" y="124">range over every pair of runs</text>
<line class="grid" x1="230.0" y1="137" x2="230.0" y2="409"/>
<text class="ink2 val" x="230.0" y="448" text-anchor="middle">−60%</text>
<line class="grid" x1="324.8" y1="137" x2="324.8" y2="409"/>
<text class="ink2 val" x="324.8" y="448" text-anchor="middle">−40%</text>
<line class="grid" x1="419.6" y1="137" x2="419.6" y2="409"/>
<text class="ink2 val" x="419.6" y="448" text-anchor="middle">−20%</text>
<line class="grid" x1="609.2" y1="137" x2="609.2" y2="409"/>
<text class="ink2 val" x="609.2" y="448" text-anchor="middle">+20%</text>
<line class="grid" x1="704.0" y1="137" x2="704.0" y2="409"/>
<text class="ink2 val" x="704.0" y="448" text-anchor="middle">+40%</text>
<line class="zero" x1="514.4" y1="137" x2="514.4" y2="409"/>
<text class="ink2 val" x="514.4" y="448" text-anchor="middle">0</text>
<text class="ink lbl" x="202" y="153" text-anchor="end">click-help-spec</text>
<text class="ink2 val" x="202" y="166" text-anchor="end">444k → 266k</text>
<path class="win" d="M328.5,146.5H514.4V161.5H328.5A4,4 0 0 1 324.5,157.5V150.5A4,4 0 0 1 328.5,146.5Z"><title>click-help-spec: 444k → 266k tokens (−40.1%); over every pair of runs −51.6% to −26.7%, success 2/2 → 2/2</title></path>
