<path class="lose" d="M514.4,350.5H577.2A4,4 0 0 1 581.2,354.5V361.5A4,4 0 0 1 577.2,365.5H514.4Z"><title>click-footer-year: 119k → 136k tokens (+14.1%); over every pair of runs +1.5% to +26.7%, success 2/2 → 2/2</title></path>
<path class="whisk" d="M521.5,354V362M521.5,358H641.0M641.0,354V362"/>
