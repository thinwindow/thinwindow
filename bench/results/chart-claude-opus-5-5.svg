<svg xmlns="http://www.w3.org/2000/svg" width="780" height="448" viewBox="0 0 780 448" role="img" aria-labelledby="t d">
<title id="t">thinwindow benchmark: change in total tokens per task, claude-opus-5-5</title>
<desc id="d">One bar per task, showing the change in median total tokens against plain Claude Code. Bars left of the zero line are tokens saved, bars to the right are tokens lost. Overall 2.10M versus 1.77M (−15.8%); success 16/16 versus 16/16.</desc>
<style>
  /* Edit these six lines to restyle every chart. Light values first, dark
     below; both are validated categorical slots 1 and 2. */
  svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--grid:#d1d9e0;--base:#2a78d6;--tw:#eb6834}
  @media (prefers-color-scheme: dark){
    svg{--surface:#1a1a19;--ink:#ffffff;--ink-2:#c3c2b7;--grid:#3d444d;--base:#3987e5;--tw:#d95926}
  }
  text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink-2)}
  .grid{stroke:var(--grid);stroke-width:1}
  .zero{stroke:var(--ink-2);stroke-width:1.5}
  .win{fill:var(--tw)}.lose{fill:var(--base)}
  .h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .h2{font-size:12px}.lbl{font-size:12px}.val{font-size:11px}
  .delta{font-size:12px;font-weight:650}
</style>
<rect width="780" height="448" fill="var(--surface)"/>
<text class="ink h1" x="0" y="24">Change in total tokens per task</text>
<text class="ink2 h2" x="0" y="44">claude-opus-5-5 · Claude Code 2.1.282 · medians of up to 2 runs per task and condition</text>
<text class="ink" x="0" y="76" font-size="24" font-weight="680">−15.8%</text>
<text class="ink2 h2" x="104" y="76">overall · 2.10M → 1.77M · success 16/16 → 16/16</text>
<rect class="win" x="0" y="94" width="11" height="11" rx="2"/><text class="ink lbl" x="17" y="104">fewer tokens with ThinWindow</text>
<rect class="lose" x="200" y="94" width="11" height="11" rx="2"/><text class="ink lbl" x="217" y="104">fewer tokens without it</text>
<line class="grid" x1="276.0" y1="115" x2="276.0" y2="387"/>
<text class="ink2 val" x="276.0" y="426" text-anchor="middle">−60%</text>
<line class="grid" x1="383.5" y1="115" x2="383.5" y2="387"/>
<text class="ink2 val" x="383.5" y="426" text-anchor="middle">−40%</text>
<line class="grid" x1="491.0" y1="115" x2="491.0" y2="387"/>
<text class="ink2 val" x="491.0" y="426" text-anchor="middle">−20%</text>
<line class="grid" x1="706.0" y1="115" x2="706.0" y2="387"/>
<text class="ink2 val" x="706.0" y="426" text-anchor="middle">+20%</text>
<line class="zero" x1="598.5" y1="115" x2="598.5" y2="387"/>
<text class="ink2 val" x="598.5" y="426" text-anchor="middle">0</text>
<text class="ink lbl" x="202" y="131" text-anchor="end">click-help-spec</text>
<text class="ink2 val" x="202" y="144" text-anchor="end">444k → 266k</text>
<path class="win" d="M387.2,124.5H598.5V139.5H387.2A4,4 0 0 1 383.2,135.5V128.5A4,4 0 0 1 387.2,124.5Z"><title>click-help-spec: 444k → 266k tokens (−40.1%), success 2/2 → 2/2</title></path>
<text class="ink delta" x="375.2" y="136" text-anchor="end">−40.1%</text>
<text class="ink lbl" x="202" y="165" text-anchor="end">commander-extract-utils</text>
<text class="ink2 val" x="202" y="178" text-anchor="end">385k → 258k</text>
