name: Pages

# Publishes website/ to GitHub Pages. The page loads ../assets so it also
# works when opened straight from a clone; here that folder is copied next to
# it and the prefix rewritten.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R website/. _site/
          cp -R assets _site/assets
          sed -i -e 's#\.\./assets/#assets/#g' _site/index.html
          if grep -n '\.\./' _site/index.html; then echo "unrewritten ../ path"; exit 1; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
