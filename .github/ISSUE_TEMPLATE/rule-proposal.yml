name: Rule proposal
description: Propose a new rule, or a change to a rule or threshold.
labels: [rule]
body:
  - type: markdown
    attributes:
      value: |
        Every rule costs tokens in every session, and `rules/thinwindow.md` has a hard budget (~500 tokens). A rule comes with evidence: the compliance table (`node bench/compliance.mjs`) and, when the decision depends on how the model reacts, a few targeted runs whose pass and fail criteria are written before running them. See CONTRIBUTING.md.
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: The exact wording you propose, or the hook behaviour and threshold.
    validations:
      required: true
  - type: textarea
    id: waste
    attributes:
      label: The waste it removes
      description: What agents do today that burns tokens, with an example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The compliance table, and any targeted runs (commands, model, reps, the criteria you wrote first, and the report). Leave empty if you're asking for help measuring it.
